name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate shell scripts
        run: |
          set -euo pipefail
          find scripts .devcontainer -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n

      - name: Validate upstream registry
        run: bash scripts/upstreams/validate-registry.sh

      - name: Check for accidentally committed private keys
        run: |
          set -euo pipefail
          if git grep -nE -- '-----BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----' ':!*.example'; then
            echo 'Private-key material detected.' >&2
            exit 1
          fi

      - name: Ensure local upstream cache is not tracked
        run: |
          set -euo pipefail
          if git ls-files '.ananas/upstreams/**' | grep -q .; then
            echo 'Pinned upstream source cache must never be committed.' >&2
            exit 1
          fi

      - name: Run workspace health check
        run: bash scripts/healthcheck.sh

  web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install web dependencies
        run: npm install

      - name: Build Ananas product shell
        run: npm run build
